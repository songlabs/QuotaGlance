name: Simulator Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.songlabs.QuotaGlance
      WATCH_BUNDLE_ID: com.songlabs.QuotaGlance.watchkitapp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select and verify Xcode 26.3
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.log"
          xcrun simctl list devices available | tee "$RUNNER_TEMP/available-simulators.log"
          xcrun simctl help pair | tee "$RUNNER_TEMP/simctl-pair-help.log"

      - name: Select required Simulators
        run: |
          set -euo pipefail
          selections=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices_by_runtime = JSON.parse(STDIN.read).fetch("devices")

            choose = lambda do |platform, required_name|
              candidates = devices_by_runtime.filter_map do |runtime, devices|
                version = runtime[%r{SimRuntime\.#{platform}-(\d+(?:-\d+)*)}, 1]
                next unless version && version.split("-").first.to_i == 26
                matches = devices.select do |device|
                  required_name == "iPhone 17" ? device["name"] == required_name : device["name"].start_with?(required_name)
                end
                next if matches.empty?
                device = matches.max_by { |item| item.fetch("name")[/\((\d+)mm\)/, 1].to_i }
                [version.split("-").map(&:to_i), version.tr("-", "."), device]
              end
              candidates.max_by(&:first)
            end

            phone = choose.call("iOS", "iPhone 17")
            abort "Required simulator not found: iPhone 17" unless phone
            watch = choose.call("watchOS", "Apple Watch Series 11")
            abort "Required simulator not found: Apple Watch Series 11" unless watch
            puts [phone[2].fetch("udid"), phone[2].fetch("name"), phone[1]].join("|")
            puts [watch[2].fetch("udid"), watch[2].fetch("name"), watch[1]].join("|")
          ')
          IFS='|' read -r IPHONE_UDID IPHONE_NAME IOS_VERSION <<< "$(sed -n '1p' <<< "$selections")"
          IFS='|' read -r WATCH_UDID WATCH_NAME WATCHOS_VERSION <<< "$(sed -n '2p' <<< "$selections")"
          {
            echo "IPHONE_UDID=$IPHONE_UDID"
            echo "IPHONE_NAME=$IPHONE_NAME"
            echo "IOS_VERSION=$IOS_VERSION"
            echo "WATCH_UDID=$WATCH_UDID"
            echo "WATCH_NAME=$WATCH_NAME"
            echo "WATCHOS_VERSION=$WATCHOS_VERSION"
          } >> "$GITHUB_ENV"
          printf 'iPhone device: %s\niOS runtime: %s\niPhone UDID: %s\n' "$IPHONE_NAME" "$IOS_VERSION" "$IPHONE_UDID"
          printf 'Watch device: %s\nwatchOS runtime: %s\nWatch UDID: %s\n' "$WATCH_NAME" "$WATCHOS_VERSION" "$WATCH_UDID"

      - name: Pair and boot Simulators
        run: |
          set -euo pipefail
          pairs_file="$RUNNER_TEMP/simctl-pairs.log"
          xcrun simctl list pairs | tee "$pairs_file"
          if ! ruby -e 'text = File.read(ARGV[0]); exit(text.include?(ARGV[1]) && text.include?(ARGV[2]) ? 0 : 1)' \
            "$pairs_file" "$IPHONE_UDID" "$WATCH_UDID"; then
            echo "Pairing $WATCH_NAME ($WATCH_UDID) with $IPHONE_NAME ($IPHONE_UDID)"
            xcrun simctl pair "$WATCH_UDID" "$IPHONE_UDID"
            xcrun simctl list pairs | tee "$pairs_file"
          fi
          ruby -e 'text = File.read(ARGV[0]); abort "Target iPhone/Watch pair was not established" unless text.include?(ARGV[1]) && text.include?(ARGV[2])' \
            "$pairs_file" "$IPHONE_UDID" "$WATCH_UDID"
          echo "pairing status: paired"

          xcrun simctl boot "$IPHONE_UDID" 2>/dev/null || test "$(xcrun simctl list devices | awk -v id="$IPHONE_UDID" '$0 ~ id { print $NF }')" = "(Booted)"
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          xcrun simctl boot "$WATCH_UDID" 2>/dev/null || test "$(xcrun simctl list devices | awk -v id="$WATCH_UDID" '$0 ~ id { print $NF }')" = "(Booted)"
          xcrun simctl bootstatus "$WATCH_UDID" -b

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project QuotaGlance.xcodeproj -scheme QuotaGlance

      - name: Build Debug app for iPhone 17
        run: |
          set -o pipefail
          xcodebuild build \
            -project QuotaGlance.xcodeproj \
            -scheme QuotaGlance \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/simulator-build.log"

      - name: Install iPhone and Watch apps
        run: |
          set -euo pipefail
          candidates_file="$RUNNER_TEMP/main-app-candidates.txt"
          find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d -path '*Debug-iphonesimulator/QuotaGlance.app' -print > "$candidates_file"
          test "$(wc -l < "$candidates_file" | tr -d ' ')" = 1
          APP_PATH=$(cat "$candidates_file")
          built_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$built_bundle_id" = "$APP_BUNDLE_ID"
          echo "App path: $APP_PATH"
          echo "iPhone bundle ID: $built_bundle_id"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          watch_candidates="$RUNNER_TEMP/watch-app-candidates.txt"
          find "$APP_PATH/Watch" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print > "$watch_candidates"
          test "$(wc -l < "$watch_candidates" | tr -d ' ')" = 1
          WATCH_APP_PATH=$(cat "$watch_candidates")
          built_watch_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH_APP_PATH/Info.plist")
          test "$built_watch_bundle_id" = "$WATCH_BUNDLE_ID"
          echo "Watch app path: $WATCH_APP_PATH"
          echo "Watch bundle ID: $built_watch_bundle_id"
          echo "WATCH_APP_PATH=$WATCH_APP_PATH" >> "$GITHUB_ENV"

          xcrun simctl install "$IPHONE_UDID" "$APP_PATH"

          if ! xcrun simctl get_app_container "$WATCH_UDID" "$WATCH_BUNDLE_ID" app >/dev/null 2>&1; then
            xcrun simctl install "$WATCH_UDID" "$WATCH_APP_PATH"
          fi

      - name: Capture required screenshot scenarios
        run: |
          set -euo pipefail
          mkdir -p screenshots/iphone screenshots/watch

          capture_iphone() {
            local filename=$1
            shift
            xcrun simctl terminate "$IPHONE_UDID" "$APP_BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl uninstall "$IPHONE_UDID" "$APP_BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl install "$IPHONE_UDID" "$APP_PATH"
            xcrun simctl launch "$IPHONE_UDID" "$APP_BUNDLE_ID" --screenshot-mode "$@"
            sleep 4
            xcrun simctl io "$IPHONE_UDID" screenshot "screenshots/iphone/$filename"
            test -s "screenshots/iphone/$filename"
          }

          capture_watch() {
            local filename=$1
            shift
            xcrun simctl terminate "$WATCH_UDID" "$WATCH_BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl uninstall "$WATCH_UDID" "$WATCH_BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl install "$WATCH_UDID" "$WATCH_APP_PATH"
            xcrun simctl launch "$WATCH_UDID" "$WATCH_BUNDLE_ID" --screenshot-mode "$@"
            sleep 4
            xcrun simctl io "$WATCH_UDID" screenshot "screenshots/watch/$filename"
            test -s "screenshots/watch/$filename"
          }

          capture_iphone iphone17-dashboard-pro.png \
            --screenshot-screen dashboard --screenshot-access pro
          capture_iphone iphone17-settings-top-pro.png \
            --screenshot-screen settings --screenshot-access pro
          capture_iphone iphone17-settings-display-watch-pro.png \
            --screenshot-screen settings --screenshot-access pro --screenshot-position display
          capture_iphone iphone17-upgrade-free-trial-available.png \
            --screenshot-screen upgrade --screenshot-access free
          capture_iphone iphone17-upgrade-free-comparison-purchase.png \
            --screenshot-screen upgrade --screenshot-access free --screenshot-position comparison
          capture_iphone iphone17-upgrade-trial-active.png \
            --screenshot-screen upgrade --screenshot-access trial
          capture_iphone iphone17-upgrade-trial-expired.png \
            --screenshot-screen upgrade --screenshot-access trial-expired
          capture_iphone iphone17-upgrade-lifetime-pro.png \
            --screenshot-screen upgrade --screenshot-access pro

          capture_watch watch-series11-dashboard-free.png --screenshot-access free
          capture_watch watch-series11-dashboard-pro.png --screenshot-access pro
          capture_watch watch-series11-dashboard-pro-refresh.png \
            --screenshot-access pro --screenshot-position refresh

      - name: Validate required screenshot inventory
        run: |
          set -euo pipefail
          expected=(
            screenshots/iphone/iphone17-dashboard-pro.png
            screenshots/iphone/iphone17-settings-top-pro.png
            screenshots/iphone/iphone17-settings-display-watch-pro.png
            screenshots/iphone/iphone17-upgrade-free-trial-available.png
            screenshots/iphone/iphone17-upgrade-free-comparison-purchase.png
            screenshots/iphone/iphone17-upgrade-trial-active.png
            screenshots/iphone/iphone17-upgrade-trial-expired.png
            screenshots/iphone/iphone17-upgrade-lifetime-pro.png
            screenshots/watch/watch-series11-dashboard-free.png
            screenshots/watch/watch-series11-dashboard-pro.png
            screenshots/watch/watch-series11-dashboard-pro-refresh.png
          )

          for screenshot in "${expected[@]}"; do
            test -s "$screenshot"
          done

          actual_count=$(find screenshots -type f -name '*.png' | wc -l | tr -d ' ')
          test "$actual_count" = "${#expected[@]}"
          echo "Screenshot inventory:"
          find screenshots -type f -name '*.png' -print | sort
          find screenshots -type f -name '*.png' -exec file {} + | sort | tee "$RUNNER_TEMP/screenshot-files.log"

      - name: Collect Simulator diagnostics
        if: always()
        run: |
          xcrun simctl list > "$RUNNER_TEMP/simctl-list.log" || true
          xcrun simctl list pairs > "$RUNNER_TEMP/simctl-pairs-final.log" || true
          if [[ -n "${IPHONE_UDID:-}" ]]; then
            xcrun simctl spawn "$IPHONE_UDID" log show --last 10m --style compact \
              --predicate 'process == "QuotaGlance"' > "$RUNNER_TEMP/quota-glance-iphone.log" || true
          fi
          if [[ -n "${WATCH_UDID:-}" ]]; then
            xcrun simctl spawn "$WATCH_UDID" log show --last 10m --style compact \
              --predicate 'process == "QuotaGlance Watch App"' > "$RUNNER_TEMP/quota-glance-watch.log" || true
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quota-glance-simulator-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot-diagnostics
          path: ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: ignore
